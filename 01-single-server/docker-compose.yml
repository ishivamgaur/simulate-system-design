services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    mem_limit: 128m
    cpus: 0.25

  api:
    build: ./api
    depends_on:
      - mongodb
    mem_limit: 512m
    cpus: 0.75

  mongodb:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    cpus: 1

volumes:
  mongo_data: